<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cifra de César</title>
<style>
:root{--bg:#f6f4ef;--card:#fff;--ink:#1d1d1f;--mute:#6b6b70;--line:#d9d6cc;--acc:#b4442b;--ring:#efeadd;--ring2:#f9e3d9;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17171a;--card:#212125;--ink:#f1f0ec;--mute:#9a9aa2;--line:#3a3a40;--acc:#ff8a6b;--ring:#2a2a2f;--ring2:#4a2e26;color-scheme:dark}}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5}
main{max-width:560px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:1.5rem;margin:0 0 4px}
p.sub{margin:0 0 16px;color:var(--mute);font-size:.95rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:16px}
svg{width:100%;height:auto;display:block;touch-action:none;user-select:none}
#inner{cursor:grab;transition:transform .45s cubic-bezier(.3,.9,.3,1)}
#inner.drag{transition:none;cursor:grabbing}
text{fill:var(--ink);font-weight:700;font-family:system-ui,sans-serif}
.controls{display:flex;gap:8px;align-items:center;justify-content:center;margin-top:12px;flex-wrap:wrap}
button,input,textarea{font:inherit;color:var(--ink)}
button{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 14px;cursor:pointer}
button:hover{border-color:var(--acc)}
button.on{background:var(--acc);border-color:var(--acc);color:#fff}
input[type=number]{width:72px;text-align:center;font-size:1.2rem;font-weight:700;padding:6px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
textarea{width:100%;min-height:90px;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);resize:vertical}
label{display:block;font-size:.85rem;color:var(--mute);margin:12px 0 4px}
.seg{display:flex;gap:8px;margin-bottom:4px}.seg button{flex:1}
#out{background:var(--ring2);min-height:90px;white-space:pre-wrap;word-break:break-word}
.hint{font-size:.85rem;color:var(--mute);text-align:center;margin:8px 0 0;transition:color .2s}
.hint.nope{color:var(--acc);font-weight:700}
</style>
</head>
<body>
<main>
<h1>Cifra de César</h1>
<p class="sub">A roda de dentro só gira no sentido anti-horário, como a versão física.</p>

<div class="card">
<svg id="wheel" viewBox="0 0 400 400" role="img" aria-label="Roda da cifra de César"></svg>
<div class="controls">
<button id="step">↺ Girar 1 casa</button>
<label for="shift" style="margin:0">Casas:</label>
<input id="shift" type="number" min="0" max="25" value="0" aria-label="Número de casas no sentido anti-horário">
</div>
<p class="hint" id="hint">Fora: texto original · Dentro: texto cifrado</p>
</div>

</main>

<script>
(function(){
var A="ABCDEFGHIJKLMNOPQRSTUVWXYZ",N=26,STEP=360/N,C=200;
var svg=document.getElementById("wheel"),hint=document.getElementById("hint"),shift=0,rot=0;
var NS="http://www.w3.org/2000/svg",HINT="Fora: texto original · Dentro: texto cifrado";
function el(t,a,p){var e=document.createElementNS(NS,t);for(var k in a)e.setAttribute(k,a[k]);(p||svg).appendChild(e);return e}
el("circle",{cx:C,cy:C,r:192,fill:"var(--ring)",stroke:"var(--line)"});
el("circle",{cx:C,cy:C,r:150,fill:"var(--card)",stroke:"var(--line)"});
for(var i=0;i<N;i++){
  var a=(i*STEP-STEP/2)*Math.PI/180;
  el("line",{x1:C+150*Math.sin(a),y1:C-150*Math.cos(a),x2:C+192*Math.sin(a),y2:C-192*Math.cos(a),stroke:"var(--line)"});
  var t=el("text",{x:C,y:C-163,"text-anchor":"middle","font-size":24,transform:"rotate("+(i*STEP)+" "+C+" "+C+")"});
  t.textContent=A[i];
}
var inner=el("g",{id:"inner"});
el("circle",{cx:C,cy:C,r:146,fill:"var(--ring2)",stroke:"var(--acc)","stroke-width":1.5},inner);
el("circle",{cx:C,cy:C,r:92,fill:"var(--card)",stroke:"var(--line)"},inner);
for(i=0;i<N;i++){
  var q=(i*STEP-STEP/2)*Math.PI/180;
  el("line",{x1:C+92*Math.sin(q),y1:C-92*Math.cos(q),x2:C+146*Math.sin(q),y2:C-146*Math.cos(q),stroke:"var(--line)"},inner);
  var u=el("text",{x:C,y:C-108,"text-anchor":"middle","font-size":20,transform:"rotate("+(i*STEP)+" "+C+" "+C+")"},inner);
  u.textContent=A[i];
  if(i===0)u.setAttribute("style","fill:var(--acc)");
}
// marcador que acompanha a roda (indica o A de dentro)
el("path",{d:"M200 114 L193 128 L207 128 Z",fill:"var(--acc)"},inner);
// seta fixa: sentido permitido
var ar=el("text",{x:C,y:C+16,"text-anchor":"middle","font-size":52,style:"fill:var(--acc);font-weight:400"});
ar.textContent="↺";
function draw(){inner.style.transformOrigin=C+"px "+C+"px";inner.style.transform="rotate("+rot+"deg)"}
function sync(){shift=((Math.round(-rot/STEP)%N)+N)%N;document.getElementById("shift").value=shift}
var tm;
function nope(){hint.textContent="Só gira no sentido anti-horário ↺";hint.classList.add("nope");clearTimeout(tm);tm=setTimeout(function(){hint.textContent=HINT;hint.classList.remove("nope")},1400)}
function turn(steps){
  if(steps<=0)return;
  inner.style.transitionDuration=Math.min(1.6,.3+steps*.06)+"s";
  rot-=steps*STEP;draw();sync();
}
// arrastar com trava (catraca): só avança no sentido anti-horário
var dragging=false,last=0,cum=0,best=0;
function ang(e){var r=svg.getBoundingClientRect();return Math.atan2(e.clientX-(r.left+r.width/2),-(e.clientY-(r.top+r.height/2)))*180/Math.PI}
inner.addEventListener("pointerdown",function(e){dragging=true;inner.classList.add("drag");last=ang(e);cum=0;best=0;svg.setPointerCapture(e.pointerId)});
svg.addEventListener("pointermove",function(e){
  if(!dragging)return;
  var n=ang(e),d=n-last;if(d>180)d-=360;if(d<-180)d+=360;last=n;cum+=d;
  if(cum<best){rot+=cum-best;best=cum}
  else if(cum>best+6)nope();
  draw();sync();
});
function end(){if(!dragging)return;dragging=false;inner.classList.remove("drag");inner.style.transitionDuration=".2s";rot=Math.round(rot/STEP)*STEP;draw();sync()}
svg.addEventListener("pointerup",end);svg.addEventListener("pointercancel",end);
document.getElementById("step").onclick=function(){turn(1)};
document.getElementById("shift").onchange=function(){
  var n=Math.round(+this.value);if(isNaN(n)){this.value=shift;return}
  n=((n%N)+N)%N;turn((n-shift+N)%N);this.value=shift;
};
draw();
})();
</script>
</body>
</html>
